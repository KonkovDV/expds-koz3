[package]
name = "expds_fast"
version = "0.1.0"
edition = "2021"
description = "КОЗ №3, speedup: LAS → сетка 0,25 м (сумма/число/минимум по ячейкам) побитно как numpy bincount / minimum.at"
publish = false
license = "MIT"

[lib]
name = "expds_fast"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py312"] }
numpy = "0.30"
rayon = "1.12"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
