name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest уезжает на Ubuntu 26 с 19.10.2026 (runner-images#14748) — фиксируем образ
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Byte-compile code dirs
        # analysis/ is an archive of bot runs, not submission code
        run: python -m compileall -q expds scripts inference tests centerhead materials
      - name: PyTorch CPU (те же версии, что docker/Dockerfile)
        # torch и torchvision — ПАРОЙ с одного индекса: иначе timm тянет torchvision с PyPI под другой torch
        # и сбор тестов падает (RuntimeError: operator torchvision::nms does not exist; проверено 29.10)
        run: pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Dependencies
        run: pip install -r requirements-dev.txt
      - name: Import smoke (entrypoint)
        run: python -c "import expds.pipeline, expds.watchdog, expds.post, expds.metric; print('import ok')"
      - name: Tests on synthetic data (no competition data, no GPU)
        # tests needing data, weights or expds/geo_pixgbm.py are skipped with a reason (-rs)
        run: pytest -q -rs
      - name: centerhead tests
        run: pytest -q -rs centerhead/tests
