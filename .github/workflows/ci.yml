name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Byte-compile code dirs
        # analysis/ is an archive of bot runs, not submission code
        run: python -m compileall -q expds scripts inference tests centerhead materials
      - name: PyTorch CPU
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Dependencies
        run: pip install -r requirements-dev.txt
      - name: Import smoke (entrypoint)
        run: python -c "import expds.pipeline, expds.watchdog, expds.post, expds.metric; print('import ok')"
      - name: Tests on synthetic data (no competition data, no GPU)
        # tests needing data, weights or expds/geo_pixgbm.py are skipped with a reason (-rs)
        run: pytest -q -rs
      - name: centerhead tests
        run: pytest -q -rs centerhead/tests
