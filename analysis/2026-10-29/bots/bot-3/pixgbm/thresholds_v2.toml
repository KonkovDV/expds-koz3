# PIXGBM S (v2, bot-3, 29.10.2026 ~00:00 МСК): пороги выдачи групп *_pix для моделей models/all.
# Вставить в configs/default.toml рядом с прочими [thresholds_by_markup.*]. Применяет post.apply_thresholds
# (watchdog.finish) по threshold_group = "<метод>_pix". БЕЗ этих секций сдача S берёт [thresholds] object_poly/finds_points = 0.0,
# т.е. все pix-кандидаты — по пулу LOFO OOF это 0,30398 против 0,33610 у стека (−0,032), см. thr/thr_v2b.json.
# Подбор: пул LOFO OOF (pix_lofo.geojson, каждый участок — модель без своей семьи), правило S (eval_pix.variant_S),
# официальный compute_metrics.py, scope global, весь трейн; прочие группы — пороги сдачи. thr/thr_v2*.py, thr/*.json.
# Итог (точный перематч): 0,347059 (finds F1 0,5675, object_poly F1 0,3033) против τ=0: 0,303975; стек: 0,336103.

[thresholds_by_markup.maggr_pix]
finds_points = 0.93   # оптимум 0,938 (острый сверху: +0,05 → F1 −0,18); 0,93 — нижний край плато ±0,005 F1;
                      # оптимум без каждой семьи 0,937–0,952; точный перематч 0,93 не хуже 0,938
object_poly = 0.686   # оптимум 0,686; без каждой семьи 0,685–0,687; плато ±0,005 F1 = [0,679; 0,735]

[thresholds_by_markup.etgr_pix]
object_poly = 0.0     # пик 0,546 узкий (±0,002 F1 = [0,544; 0,547]) и даёт +0,00015 к баллу; только Гнёздово — не берём

[thresholds_by_markup.terfl_pix]
object_poly = 1.01    # = выкинуть pix-TerFl: любой τ ≥ 0,70 в пределах 0,0013 F1, τ=0 хуже на 0,0011 балла;
                      # только Гнёздово (212, 217), проверить вне семьи нельзя
