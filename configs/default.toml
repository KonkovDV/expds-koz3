# ---------------------------------------------------------------------------
# bot-4: крупные объекты (>5k м²). По умолчанию ВЫКЛЮЧЕНО — поведение = v4/cbd4804.
# Включать только вместе с честным замером (honest-10 / по слою): area-aware τ,
# защита крупного при склейке, ядра только у крупных gor, fort→gor, грубый hillfort.
# Не путать с отвергнутым bot-2 F1 (отдельные группы под sweep) и F2 (ядра глобально).
# ---------------------------------------------------------------------------
[large_objects]
# Мастер OFF → байт-в-байт cbd4804. Sub-flags независимо false (ablation: enabled=true + один).
enabled = false
area_tau = false
protect_merge = false
shape_cores = false
fort_to_gor = false
coarse_hillfort = false
# Fix C: абсолютный τ для крупных D-FINE Ae gorodishcha (ae_ortho_diagnosis §3).
# Gate только ae + gorodishcha (li не трогаем). Нужен stash box_area_m2. OFF по умолчанию.
# Ожидание +0.005…0.02 LB при dfine_aeor ae; без Ae D-FINE → Δ=0 (LESSONS).
dfine_ae_gor_area_tau = false
