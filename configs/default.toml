# Конфигурация инференса КОЗ №3. Пути к моделям — относительно корня архива.

default_threshold = 0.15

[time]
budget_s = 1500      # 25 минут из 30: запас на запуск контейнера и запись
reserve_s = 120      # не начинать тяжёлый шаг, если осталось меньше
watchdog = true      # за 3 минуты до 30 минут записать уже найденное и выйти
guard_margin_s = 180 # запас сторожа до снятия контейнера; сверить с первым логом платформы
# bot-8: дедлайн внутри цикла окон снимков (ae/sp_or/or, sp_focal2, сети геофизики). Окно не начинается,
# если до конца budget_s или до сторожа (1800 − guard_margin_s = 1620 с) осталось ≤ window_reserve_s;
# файл отдаёт объекты пройденных окон, дальше обычный конец прогона и запись. false — как раньше.
window_deadline = true
window_reserve_s = 30
# bot-8 (bot8-softceil-pixgbm 26e12ae/428257f, bot-8/STATUS.md 23:58 и 02:10 МСК): мягкий потолок 1200 с от старта
# процесса (тот же отсчёт, что у сторожа 1620). При soft_left ≤ порога шаг пропускается: окно 256 м sp_focal2 (120 с,
# на растр) → σ li_dev (60 + 60 резерв кропа, на участок) → кроп курганов (60). Строка в логе «мягкий потолок: … пропущено».
# Геофизика (вкл. PIXGBM), лидар, основная оптика, finish/safe_finish и запись не отключаются; TimeGuard 1500 и сторож
# 1620 как раньше. Env EXPDS_SOFT_CEILING_S важнее; ≤ 0 / не число — выключен. Пороги: [time.soft] wide_window/sigma/verify.
soft_ceiling_s = 1200
# Аудит 29.10: закрытая выборка финала может быть больше публичной (48 участков). Выход при запасе времени тот же.
# optics_order = "small_first"  — оптика от дешёвых снимков к дорогим (гигантское ортофото не съедает остальных).
# optics_s_per_gb               — лидар оставляет оптике столько с на ГБ снимков (0 — выкл.).
# bot-7 v3: защита ВКЛЮЧЕНА по умолчанию. Объекты после прохода оптики возвращаются в исходный порядок участков
# (pipeline._restore_optics_order), так что при запасе времени выход побайтно тот же (проверено на synth/210/214/217).
# optics_s_per_gb = 10 — неполный запас (на ПК оптика ≈ 64 с/ГБ: 25,5 ГБ за 1624 с, аудит R5): лидар не берёт новый
# участок, если прошло больше 1500 − 120 − 10·ГБ с. На прогоне в бюджете (≤ 1200 с всего) лидар кончается раньше
# этой черты, пока снимков меньше ~(1380 − конец лидара)/10 ГБ, — выход не меняется.
optics_order = "small_first"
optics_s_per_gb = 10.0

# CRS участка. На 54 участках с LAS голосование совпало с UTM.json (notes/crs_audit_2026-10-24.json).
# Расхождения заголовка LAS не накрывали эталон лучше, поэтому балл 0,353793 не сдвигается.
[crs]
policy = "vote"

# Инференс в той точности, в которой подбирались пороги. FP16 и TF32 на RTX 4090
# сдвигают вероятности у порогов 0,98–0,9995.
[infer]
amp = false
tf32 = false
deterministic = true

# Пороги выдачи по классам. Старт — F/(4−F) ≈ 0,1–0,2; подбор:
# python -m expds.metric sweep ... --out configs/thresholds.json и перенос сюда.
[thresholds]
kurgany_povrezhdennye = 0.15
kurgany_tselye = 0.15
gorodishcha = 0.15
arkhitektury = 0.15
fortifikatsii = 0.20
# Геофизика отсекается своим порогом по модальности ([geophys.*] min_confidence).
object_poly = 0.0
finds_points = 0.0

# Модели по markup_type (файлы из expds.train). Нет файла — модальность
# обрабатывается классикой (li, геофизика) или пропускается (оптика).
# Пороги модели li в режиме rescore, подобраны на предсказаниях вне обучения.
[thresholds_by_markup.li]
# Сетка DEM 0,1 м. Общий порог с крупной сеткой резал мелкие насыпи: вне обучения
# по всем участкам балл 0,205 → 0,216, на 49 участках с LAS 0,310 → 0,330.
# 0,06415 — полка принятого пакета 0,353793. 0,05333 оставлял ещё 172 круга
# и ронял 34 новых участка на 0,0042 (notes/config_vs_measured_2026-10-23.json).
kurgany_povrezhdennye = 0.06415
kurgany_tselye = 0.194220
# 0,993091 — вместе с маской li_mask. Прежний 0,977365 оставлял 1 попадание,
# совместный перебор его выкинул. Курганы этой группы не сдвигались.
gorodishcha = 0.993091
arkhitektury = 1.01
# 0,999971 — вместе с маской фортификаций аэрофото (ae); группа фактически выключена.
fortifikatsii = 0.999971

# То же облако точек, но шаг DEM увеличен (ячеек больше 60 млн). Ложных курганов много,
# поэтому порог повреждённых высокий. Группа ставится в pipeline.lidar_threshold_group.
[thresholds_by_markup.li_coarse]
kurgany_povrezhdennye = 0.966705
kurgany_tselye = 0.469805
# 0,986425 — вместе с маской li_mask (было 0,983620: 39 объектов, 16 попаданий).
gorodishcha = 0.986425
arkhitektury = 1.01
# 0,999260 — вместе с маской фортификаций аэрофото (было 0,226255: 427 объектов, 7 попаданий).
fortifikatsii = 0.999260

# Курганы с мозаики 0,1→0,5 м. Городища этой группы не получают.
[thresholds_by_markup.li_mosaic]
kurgany_povrezhdennye = 0.959005
kurgany_tselye = 0.170420

# Маска городищ, окно 384 м, шаг DEM 1 м. Пять фолдов: 0,329966 → 0,338586,
# 34 новых +0,0174, без лидара без изменения, A > B в 0,999.
# 26 полигонов, 14 попаданий. Курганы не сдвигались.
[thresholds_by_markup.li_mask]
gorodishcha = 0.994510

# Маска фортификаций аэрофото, пять фолдов на эталоне со слоями EtGr без склейки:
# 0,339456 → 0,347318, 34 новых +0,0163, без лидара +0,0047, A > B в 0,983.
# 714 объектов, 94 попадания из 696 эталонов (notes/ae_fort_mask_2026-10-22.json).
[thresholds_by_markup.ae]
fortifikatsii = 0.998215
# Курганы слоя ae, которые не копии лидара. Та же полка, что у принятого табло.
kurgany_povrezhdennye = 0.99053
kurgany_tselye = 0.802255

# Маска фортификаций лидара, окно 384 м, DEM 1 м. В пакете с кругами архитектуры
# пороги ae и li_coarse не сдвинулись. 127 полигонов, 14 попаданий из 696.
# F1 фортификаций 0,1745 → 0,1877 (notes/e5_pack_2026-10-23.json).
[thresholds_by_markup.li_fort]
fortifikatsii = 0.987675

[thresholds_by_markup.sp_or]
# 0,994085 — порог совместного прогона, который дал 0,218 и 0,230.
# Значение 0,9 оставляло ещё 105 городищ между 0,9 и 0,994; метрика их выкинула.
gorodishcha = 0.994085
# Карта центров, круг 4 м. Балл фолдов 0,218156 → 0,230356; на 34 новых LAS плюс 0,0003
# (39 кругов). Бутстреп 0,993 — у соседней точки с порогом лидара 0,0641.
# Сданный порог лидара 0,06415. Файл spor_focal_r18.pt этим прогоном не измерен.
kurgany_povrezhdennye = 0.3645
kurgany_tselye = 0.3725
# Круги архитектуры 2 м. В табло группа называлась sp_arch; в сдаче это единственный
# источник класса на спутнике, поэтому порог лежит здесь. Сеть surf_arch, 27.10:
# 227 кругов, 21 попадание, честно 0,311053 → 0,314615.
arkhitektury = 0.286725

[thresholds_by_markup.or]
arkhitektury = 0.065565

# Окно 256 м только на участках без лидара, вместе с каналом σ дальше 12 м.
# 0,350588 → 0,353793, 34 новых +0,0002, без лидара +0,0098, A > B в 0,993.
# Пороги сданных групп не сдвинулись (notes/pack_wide_dev_2026-10-23.json).
[thresholds_by_markup.sp_focal2]
kurgany_povrezhdennye = 0.501645
kurgany_tselye = 0.645505

[thresholds_by_markup.li_dev]
kurgany_povrezhdennye = 0.99131
kurgany_tselye = 0.99957

# Копии курганов лидара для слоя аэрофото. 0 оставлял 25 лишних кругов против
# полки принятого табло и входил в минус 0,0042 на 34 новых участках.
[thresholds_by_markup.li_ae]
kurgany_povrezhdennye = 0.993061
kurgany_tselye = 1.000001

# Полигоны электроразведки. Детектор уже режет на 0,0958; табло оставляет с 0,096635.
[thresholds_by_markup.etgr]
object_poly = 0.096635

# bot-7 (кандидат v2): пороги групп PIXGBM на всём трейне — thr_pix_full.json у bot-3 (bot-9, fit_thr.py:
# sweep_groups по LOFO-кандидатам pix_lofo, global = site). Сверка bot-7 по кривым bot-10/work7/curves_g_S:
# те же значения; пороги фолдов k10/LOFO maggr_pix finds 0,887–0,911, op 0,659–0,685 (bot-7/work5/taus_pix.json).
# Оговорка: подобраны на LOFO-моделях, в сдаче модель all (увереннее) — пороги, вероятно, чуть занижены.
# bot-10 REPORT9_v2.md §B выбрал именно эти (T9) против bot-3 thresholds_v2.toml (T3: maggr_pix finds 0,93 /
# op 0,686, etgr_pix 0, terfl_pix 1,01): T3−T9 = −0,000924, P(T3>T9) 0,259 — шум, процедура T9 чище.
[thresholds_by_markup.maggr_pix]
finds_points = 0.902915
object_poly = 0.684725

[thresholds_by_markup.etgr_pix]
object_poly = 0.545825

[thresholds_by_markup.terfl_pix]
object_poly = 0.746421

# Запасной путь без модели li: пики рельефа + LightGBM (3 класса); пороги — по его предсказаниям
# вне обучения (F1 0,455 и 0,344).
[thresholds_by_markup.li_cpu]
kurgany_povrezhdennye = 0.0121
kurgany_tselye = 0.0096

[fusion]
# Уверенные курганы лидара в покрытии аэрофото участка — ещё и объекты слоя ae (эталон размечен
# по слоям; на снимках 1940-х распаханные позже курганы ещё целые). OOF 15 участков: балл
# 0,281 → 0,311; если в тесте дубли между слоями убраны — 0,309 → 0,287 (expds/fusion.py).
li_to_ae = true
povr_min = 0.99
tselye_min = 0.8
# register = true — копии переносятся на сдвиг снимка относительно курганов лидара (по пятнам
# самого снимка). Выключено до табло: план, раздел 2.10.

[li]
# rescore — курганы по пикам рельефа с уверенностью модели li (на отложенном Гнёздово 0,674
# против 0,538 у масок); segment — все классы масками модели.
mode = "rescore"
# Пики вероятности модели (nn_peaks) на том же OOF хуже: балл 0,283. Не включать.

# bot-8: лидар ConvNeXt bot-9 (in_kind cnx3/cnx5, контракт bot-9/CNX_CONTRACT_FOR_BOT8.md §6). ВЫКЛЮЧЕНО.
# Аддитивно: базовый лидар (li / запасной детектор) не меняется; cnx — отдельная фаза после оптики,
# её объекты дедуплицируются против уже принятых li/gor/fort (курганы — dedupe_m, маски — пересечение).
# Вход — inference/cnx/cnx_prep.py подпроцессом на ВЕСЬ участок (несколько LAS сливаются в один, сетка
# по всем точкам; паритет с обучением на много-LAS участках не гарантирован). Веса НЕ в git: только
# inference/cnx/WEIGHTS_MANIFEST.json (path, sha256, size; smoke-веса — never_pack), сборка сверяет sha256.
# Пороги — СВОЯ группа [thresholds_by_markup.<threshold_group>] со ВСЕМИ classes; li/li_coarse/... нельзя.
# Без неё cnx включён, но объектов не выдаёт (громкий WARN в логе; check_submission — FAIL).
# Включение: enabled = true, weights = ["models/cnx/weights_cnx_c3-sc_f0.pt", ...] (ансамбль — среднее
# логитов, все одного in_kind) и [thresholds_by_markup.li_cnx].
# enabled — только TOML-bool (true/false без кавычек): строка "false"/"true" или 0/1 → cnx ВЫКЛЮЧЕН + WARN.
[li_cnx]
enabled = false
weights = []
# tile = 1024          # окно CUDA (кратно 32), перекрытие overlap = 192
# tile_cpu = 512       # окно CPU, overlap_cpu = 128
# tta = 8              # 1 | 2 | 8 (D8, как OOF bot-9); время сети ≈ ×tta (8 ≈ 8× от tta 1, 2 ≈ 2×).
#                      # Не влезает в бюджет (окно − reserve_s, мягкий потолок) — 8 → 2 → 1 с WARN в логе
# fp16/fp32 — по [infer] amp (CUDA, не GTX 16xx); окно с NaN — заново в FP32; bf16 не используется
# prep_timeout_s = 600 # и не дольше остатка бюджета минус [time] reserve_s
# soft_need_s = 120    # мягкий потолок: cnx не начинается, если до него меньше
# classes = ["kurgany_povrezhdennye", "kurgany_tselye"]   # по умолчанию только курганы
# threshold_group = "li_cnx"
# dedupe_m = 12.0      # курган cnx ближе к принятому кургану — отбрасывается

# DEM для запасного детектора курганов (без модели li). С моделью li параметры берутся
# из её чекпойнта — так, как она обучалась.
[lidar]
dem_res = 0.1
dem_fill = "delaunay"
# Куски 0,1 м для курганов, если всё облако не влезает в 60 млн ячеек.
# Городища и фортификации остаются на грубой сетке. Курганы — группа li_mosaic.
# Замер 21.10: 0,319526 → 0,329966, 34 новых +0,0221, без лидара без изменения,
# A > B в 0,998. Пороги мелкой сетки в том прогоне не сдвинулись.
mosaic = true
# Сколько следующих LAS строят DEM в фоне, пока текущий участок на видеокарте (lidar.DemPrefetch).
# 0 — без фона. Каждый — до ~2 ГБ памяти на облако в 12 млн ячеек.
prefetch = 2
# Стиль отмывки g/i для li-моделей: "vendor" (как было) | "li_match" (CI2-8: Horn, σ=1 px, i=253−g,
# ближе к Li организаторов). Не замерено (PREREG P-W2-5), по умолчанию выключено.
hillshade_style = "vendor"

[models]
# Вторая итерация трудных негативов. Общий балл 0,203 против 0,197 у первой.
li = "models/li_r18_hard2.pt"
# Городища отдельной маской. Свой DEM 1 м и группа li_mask. Курганы не выдаёт.
li_mask = {path = "models/li_gor_mask_r18.pt", classes = ["gorodishcha"]}
# Городища, курганы и архитектура спутника — три модели. Курганы: фокальная карта центров,
# круг 4 м. Архитектура: круг 2 м, порог на этом же слое.
sp_or = [
  {path = "models/spor_gor_r18.pt", classes = ["gorodishcha"]},
  {path = "models/spor_focal_r18.pt", classes = ["kurgany_povrezhdennye", "kurgany_tselye"]},
  {path = "models/surf_arch_r18.pt", classes = ["arkhitektury"]},
]
# Фортификации лидара отдельной маской. Свой DEM 1 м и группа li_fort.
li_fort = {path = "models/li_fort_mask_r18.pt", classes = ["fortifikatsii"]}
# Канал σ на пиках рельефа. Круги ближе 12 м к уже оставленному кургану выбрасываются.
# Вместе с окном 256 м: 0,350588 → 0,353793. Веса — все тайлы, 18 эпох.
li_dev = {path = "models/li_dev_r18.pt", classes = ["kurgany_povrezhdennye", "kurgany_tselye"]}
# Окно 256 м только на участках без лидара. Веса — все тайлы, 19 эпох.
sp_focal2 = {path = "models/spor_focal_wide_r18.pt", classes = ["kurgany_povrezhdennye", "kurgany_tselye"]}
# Фортификации аэрофото: маска одного класса, 20 эпох на всех тайлах (медиана лучших эпох фолдов).
ae = {path = "models/ae_fort_mask_r18.pt", classes = ["fortifikatsii"]}
# Ортофото той же сетью, что архитектура спутника. Честно по семьям 27.10:
# 0,311053 → 0,314615, без лидара +0,0062, A > B в 0,897. Порог группы or — ниже.
or = {path = "models/surf_arch_r18.pt", classes = ["arkhitektury"]}
# Сеть на картах геофизики (pipeline.geo_model_feats), только вместе с порогом группы maggr_nn:
# maggr = {path = "models/maggr_finds_r18.pt", classes = ["finds_points"]}

# Городища по форме рельефа. ЦМР отдельно от курганов: 0,5 м, заполнение пирамидой.
# Честно по участкам 26.10: 0,334157 → 0,338881. Тот файл — один проход, поэтому
# relief_radius_l_m = 0. Второе окно 300 м на синтетике держит широкий мыс, но табло
# 27.10 его не приняло: 0,338881 → 0,337312. Строку 0 не менять и прогон не повторять.
[hillfort]
enabled = true
relief_radius_l_m = 0

[thresholds_by_markup.gor_phys]
gorodishcha = 0.43049

# Второй проход сети li на 1 м (крупные курганы, OSINT п. 4: Эрентуна ⌀ медиана 12 м, p90 18 м).
# Выключен. Включать только вместе с [thresholds_by_markup.li_half], подобранными вложенно
# по семьям на OOF-выгрузке (EXPDS_LI_HALF_DUMP + scripts/nn_oof.py --predict-only):
# без них проход идёт только в выгрузку. Выдаются лишь новые курганы — дальше 12 м от
# кругов основного li (любого класса кургана), которые оставляет его принятый порог. Код — expds/li_half.py.
# bot-8: enabled — только TOML-bool (true/false без кавычек), иначе выключено с предупреждением (как [li_cnx]).
# enabled = true без [thresholds_by_markup.li_half] — объектов li_half нет (WARN в логе и в check_submission);
# проход тогда идёт, только если задан EXPDS_LI_HALF_DUMP. Время: мягкий потолок, ключ [time.soft] li_half
# (env EXPDS_SOFT_NEED_LI_HALF_S, 30 с) + оценка на LAS max(5, 0,35 × t основного li × tta; v1, бот 2 намерил
# ≈0,2) + резервы wide_window/sigma/verify (и cnx) — li_half отключается первым. Ключа soft_need_s в [li_half]
# нет. Отборы 12 м: li_half — против принятых li участка, без учёта класса кургана; cnx (позже) — против всего,
# включая принятые li_half (лидар — без учёта класса, оптика — того же класса); σ — против KEPT_KURGAN_CONF
# и принятых li_half/li_cnx, того же класса.
[li_half]
enabled = false
res = 1.0
tta = 1
max_px = 30_000_000
skip_mosaic = false   # мозаика (куски 400 м, поле 40 м) проходится: Эрентуна — мозаичный LAS
skip_coarse = true    # огрублённый DEM без мозаики (li_coarse) — пропуск в v1
dedupe_m = 12.0
# NMS между своими кругами li_half БЕЗ учёта класса кургана, м (число ≥ 0; 0 — выкл., по умолчанию; не число — выкл. + WARN).
