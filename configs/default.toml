# Микрокруги архитектуры (bot-5, 28.10): тот же центр пика, радиус 0,25 м вместо 2 м.
# Попаданий не меньше ни при каком центре; оракул официальной метрикой на эталоне
# 2 м → 0,25 м: 257 → 269 из 407 при текущей цели, 0,914 → 1,000 у repr. point.
# Включать после табло: oof_transform.py micro + scoreboard.py --honest 10.
# [post.micro_circles]
# classes = ["arkhitektury"]
# radius_m = 0.25
# Пакет bot-7 (28.10): микрокруги архитектуры (bot-5) + курганы 0,5 м (bot-7).
# Пороги групп курганов/архитектуры перекалибровать по OOF после того же преобразования
# (scripts/oof_transform.py micro). Замер пакета: bot-7/REPORT2.md.
# sota_stack6, режим separate (кандидат bot-7 по сводке bot-10: EXPERIMENTS.md «Сводка решений» 21:15 МСК,
# bot-10/REPORT4.md): post.multipole_object_poly без unified_group (группы maggr_poly/etgr/terfl раздельно)
# + post.filter_finds_points_regimes, как в bot-10/work4/stack6_fam.py --mode separate.
# Честно: keep +0,015057, drop +0,006703, P 0,948 (bot-10/work4/stack6_global.json).
# Выключить: обе строки = false.
[post]
multipole_object_poly = true
filter_finds_points = true
# kurgan_twins_only (bot-6, ad8ae9b + починка масштаба 78add0e = 92ab33e здесь: один cos φ на участок,
# bot-10 REPORT6_twins §2): копии целый -> повреждённый без межтипового dedup (dedup_ae_vs_li_m = 0).
# ВКЛЮЧЁН (29.10): bot-10 принял twins-only 78add0e в пакет v2 — +0,001718 vs A, ДИ90 [+0,00039; +0,00377],
# P 0,986, LOFO +0,001603, 5/5; с курганами 0,5 м +0,003065, P 1,0 (bot-10/work8/twins78_stats.log, TO/TOfix, kurTO;
# bot-10/STATUS.md 29.10 00:20 «→ только в пакет»). Выключить: kurgan_twins_only = false
kurgan_twins_only = true
# bot-7 v3: курганы внутри предсказанных городищ (правило разметки, OSINT_2026-10-29 §1.2; PREREG bot-7/work6/kig).
# ВЫКЛ.: честно −0,000848, P 0,187, LOFO −0,000932, 0/5, new34 −0,002876 (bot-7/work6/kig/stats_kig.log);
# с эталонными городищами (оракул) всего +0,000537 — потолок ниже П1.
kurgan_in_gor = false

# Кандидат bot-7 (28.10, bot-7/REPORT3.md): только курганы 0,5 м. Микрокруги архитектуры не включены:
# поверх реранкера архитектуры добавка неустойчива (bot-5/REPORT.md, analysis/joint/summary.json).
# Пороги групп той же процедурой (sweep_groups в выборке по OOF после micro) не меняются
# (bot-7/work3/insample_tau_kur.json).
[post.micro_circles]
radius_m = { kurgany_povrezhdennye = 0.5, kurgany_tselye = 0.5 }
# LOCALIZE (bot-6, 28.10, bot-6/LOCALIZE.md): + фортификации 0,5 м — точный пост-порог honest-10
# +0,000257 (fort +3 TP / −3 FP), P(Δ>0) 0,75, lofo +0,00047, 5/5 случайных раскладок > 0;
# П1 не выполнено (< 0,002) — только в пакет, после перемера на ПК (oof_transform.py micro + scoreboard).
# Городища микрокругом не включать: −0,00155 (new34 −0,0036). Включить фортификации:
# radius_m = { kurgany_povrezhdennye = 0.5, kurgany_tselye = 0.5, fortifikatsii = 0.5 }

# Реранк архитектуры (LightGBM, отчёт REPORT_rerank.md, nested3.py): ВКЛЮЧЁН в кандидате bot-7.
# Замер: EXPERIMENTS.md (rerank_arch, +0,00974, P 0,966); перемер bot-10/work4/rerank/*.log
# (k10 +0,0095, LOFO +0,0079, 5/5 раскладок > 0); с crop verify пакетом не мерен (bot-7/REPORT3.md).
# Выключить: enabled = false (одна строка; без модели код возвращает базу).
# Модель: scripts/rerank_arch_train.py; оба файла — в models/ (build_submission берёт их по этим ключам).
[rerank_arch]
enabled = true
model = "models/rerank_arch_lgbm.txt"
meta = "models/rerank_arch_lgbm.json"

# [post]
# Выпуклая оболочка object_poly etgr/terfl (bot-6 GEO.md: LOSO +0,0017, P 0,998; на приёмке П1–П5 у bot-10).
# geo_convex_hull = true            # или { markups = ["etgr", "terfl"] }
# fill_holes = ["gorodishcha"]
# [post.core.gorodishcha]
# frac = 0.3
# min_r_m = 8.0
# Слияние уверенностей sp_focal/sp_focal2 для курганов (bot-6 ORSP), по умолчанию выключено:
# [post.sp_score_fusion]
# radius_m = 8.0
# gen_floor = 0.05          # курганы sp_or / sp_focal2 генерируются сырыми, отбор 12 м — только из выдачи
# thresholds.sp_focal = { kurgany_povrezhdennye = 0.27822, kurgany_tselye = 0.3696 }
# thresholds.sp_focal2 = { kurgany_povrezhdennye = 0.514733, kurgany_tselye = 0.701621 }
# Пороги — sweep_groups на всех участках по кривым fusion (bot-6/work/orsp2/taus_all.json). Замер см. bot-6/ORSP.md.

# Ансамбль только по курганам: path = ["models/a.pt", "models/b.pt"], ensemble_classes = ["kurgany_povrezhdennye", "kurgany_tselye"]
# Обучение: --arch FPN --ema 0.999 --scale-aug 0.25 --photo-aug 0.08. В сданных весах этого нет.

# Проверка кропа курганов спутника. Повтор 28.10 без утечки эталона: честно по семьям
# 0,314615 → 0,318536, 34 новых +0,0015, без лидара +0,0079, A > B в 0,984.
# На всех участках 0,367363 → 0,366844, старая приёмка не проходит; решает честная.
[verify]
enabled = true
weights = "models/sp_crop.pt"
markup = "sp_or"
groups = ["sp_focal", "sp_focal2"]
classes = ["kurgany_povrezhdennye", "kurgany_tselye"]
tile = 96
res = 0.5
min_conf = 0.05

