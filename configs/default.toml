# sp_focal здесь = курганы sp_or сдачи (одна карта центров; в табло подписана sp_focal) — пороги общие. Замер: bot-6/ORSP.md.

# Ансамбль только по курганам: path = ["models/a.pt", "models/b.pt"], ensemble_classes = ["kurgany_povrezhdennye", "kurgany_tselye"]
# Обучение: --arch FPN --ema 0.999 --scale-aug 0.25 --photo-aug 0.08. В сданных весах этого нет.

# Проверка кропа курганов спутника. Повтор 28.10 без утечки эталона: честно по семьям
# 0,314615 → 0,318536, 34 новых +0,0015, без лидара +0,0079, A > B в 0,984.
# На всех участках 0,367363 → 0,366844, старая приёмка не проходит; решает честная.
[verify]
enabled = true
weights = "models/sp_crop.pt"
markup = "sp_or"
groups = ["sp_focal", "sp_focal2"]
classes = ["kurgany_povrezhdennye", "kurgany_tselye"]
tile = 96
res = 0.5
min_conf = 0.05

# bot-7 (кандидат v3) / bot-5 (v4): D-FINE bot-9 на SpOr (группа порога sp_dfine).
# v4 (bot1_v3_spor_diag 29.10): SpOr D-FINE ВЫКЛ. — enabled = false. pipeline.run вызывает _sp_dfine_phase
# ТОЛЬКО при enabled; drop_groups применяется только внутри фазы. Поэтому enabled=false достаточен, чтобы
# сохранить U-Net sp_or/sp_focal/sp_arch/sp_focal2 (путь v2/v3 pre-D-FINE); отдельно drop_groups=[] не нужно,
# пока фаза не входит. DEFAULTS.drop_groups уже []. Вариант R (drop_groups = SpOr-группы) на mock дал
# soft_tp 0/13 (медиана ~191 м до GT) — НЕ включать R, пока D-FINE не локализует курганы.
# Архив сдачи v3on собирал bot-7/work6/on/make_on.py. transformers 5.21.0 — вендор inference/lib/vendor.
# Ключи — expds/sp_dfine.py DEFAULTS (weights, flip_tta, convert, drop_groups, ensemble …).
[sp_dfine]
enabled = false
# Включение (НЕ для v4 до фикса локализации; принято ботом 10 для v3on, модель СДАЧИ — f0):
#   enabled = true
#   weights = ["models/dfine_f0"]   # МОДЕЛЬ СДАЧИ: f0 bot-9 (koz3-dfine-spor-full-rest/dfine_f0, fp32; инференс fp16 autocast)
#   drop_groups = []               # v4-safe: добавить D-FINE БЕЗ снятия U-Net; НЕ вариант R, пока soft_tp≈0
#   drop_min_det = 1   # bot-2 багфикс (ВКЛ.): R только на участках с ≥N объектов sp_dfine; иначе оставляем v2
#   # drop_groups = ["sp_or", "sp_focal", "sp_arch", "sp_focal2"]   # вариант R — регрессия mock sp_or→0
#   + [thresholds_by_markup.sp_dfine] (bot-9 thr/sweep.log: OOF фолдовых моделей под f0) и [thresholds_by_markup.or] arkhitektury = 0.483891
# Финальная модель (koz3-dfine-spor-final/dfine_final) — ТОЛЬКО РЕЗЕРВ; пороги под f0, для final нужен перенос/OOF.
# Заготовка: bot-7/work6/on/FINAL_VARIANT.md.

# bot-1 (кандидат v4, 29.10): D-FINE всех классов на Ae/Or (группы порога ae_dfine / or_dfine),
# круги варианта C, слияние TTA (flip × масштабы) и моделей — WBF внутри ОДНОГО снимка. ВЫКЛ.:
# нет весов Ae+Or (Kaggle-ядро kaggle/aeor_dfine — не запущено), нет порогов из OOF, нет приёмки honest-10 ботом 10
# (bot-1/AEOR_DETECT_2026-10-29.md). Ключи и умолчания — expds/aeor_dfine.py DEFAULTS. Включение:
#   enabled = true
#   weights = { ae = ["models/dfine_aeor"], or = ["models/dfine_aeor"] }
#   scales = [1.0, 1.5]
#   + [thresholds_by_markup.ae_dfine] и [thresholds_by_markup.or_dfine] (sweep_groups по OOF ядра)
[aeor_dfine]
enabled = false

# bot-6 (29.10, на v3 360c870): D-FINE всех классов на Ae/Or (bot-9 DFINE_FINAL_ORAE.md), фаза после sp_dfine,
# до gor_gate. markup_type родной (ae/or), threshold_group dfine_ae / dfine_or. ВЫКЛ.: нет весов bot-9 Ae/Or и
# порогов из вложенного OOF (bot-6/AEOR_DETECT.md). Ключи и умолчания — expds/dfine_aeor.py DEFAULTS
# (0,5 м UTM; Ae 640/160, Or 1024/288; flip-TTA; WBF внутри растра; потолок фазы 120 с, запас ×8). Включение:
#   enabled = true
#   weights = { ae = ["models/dfine_ae"], or = ["models/dfine_or"] }
#     # = чекпойнты bot-9 koz3_shared/bot-9/models/dfine_ae и dfine_or (HF: config.json + model.safetensors fp32,
#     # 5 классов в порядке sp_dfine.CLASSES), в репозиторий — ln -s (полные пути: bot-6/AEOR_DETECT.md; личные
#     # абсолютные пути в конфиге архива запрещены тестом test_no_personal_paths_in_packaged_code,
#     # build_submission их не пакует)
#   thresholds_file = "models/dfine_aeor/thresholds_oof.json"   # {"dfine_ae": {класс: порог}, "dfine_or": {...}}; ae_dfine/or_dfine тоже принимаются
#   # scales = [1.0, 1.5]   # второй масштаб — только после замера времени на 4090
# Рецепт входа (bot-9): RGB/255 без нормализации, flip-TTA, NMS IoU 0,5, fp16 только autocast на CUDA (.half() не вызывается).
[dfine_aeor]
enabled = false

# bot-6: городища из D-FINE Or выключены порогом > 1, пока bot-10 не замерит их вместе с gor_dense bot-5.
# Ключи TOML главнее thresholds_file. Объектов dfine_or нет при [dfine_aeor] enabled=false.
[thresholds_by_markup.dfine_or]
gorodishcha = 1.01

# bot-7 (кандидат v3): шлюз городищ DINOv2-S bot-5 (bot-5/FOR_BOT7_GOR_V3.md, ветка bot5-gor-patch-kaggle abb89d0+82058b8).
# conf городищ sp_or (без threshold_group) × p участка (max p виньеток 384 м + контекст 768 м) → группа sp_or_gated.
# ВЫКЛ. Ставить ТОЛЬКО без варианта R D-FINE (R выбрасывает sp_or — шлюзу нечего гейтить; bot-10 §1). Включение:
#   enabled = true
#   backbone = "models/dinov2-small"            # config.json + model.safetensors (md5 сверяется: ea251be6…)
#   head = "models/gor_gate/gor_v3_head.npz"     # md5 acb95c52…
#   + [thresholds_by_markup.sp_or_gated] gorodishcha = 0.992648 (bot-5 gor_v3_taus.json, sweep_groups на всём трейне)
# Время: CPU 2 потока ≈0,45 с/виньетку (≈33 виньетки на участок); при нехватке — участок не гейтится (guard/soft_ok).
[gor_gate]
enabled = false

# [raster_fix]              # bot-6, опыт за флагом (bot6-optics), без секции — выключено
# reproject_3857 = true     # снимок EPSG:3857 → UTM из UTM.json участка (трейн: 015 Демидовка, 029 Вышегжа_3)
# int16_identity = true     # int16/uint16 со значениями 0–255 — как uint8, без растяжки p1–p99 (трейн: 106 ×3,04)
# zero_nodata = true        # объект с внутренней точкой в поле нулей/nodata ≥ zero_nodata_px² выбрасывается (017, 036)
# zero_nodata_px = 5
# markups = ["ae"]

[speed]
# Харвест ветки speedup-2026-10-28 (29.10.2026): ускорения CPU-пути, задуманы побайтно тем же выходом,
# но на реальных данных/4090 не перемерены — по умолчанию ВЫКЛ. (путь сдачи = v2). Описание флагов —
# expds/speed.py; env EXPDS_SPEEDUP=1 / EXPDS_SPEED_<ИМЯ>=1 важнее конфига.
enabled = false
# meta_init = true      # сеть на meta + assign весов (без случайной инициализации)
# no_pad_copy = true    # без копии снимка через np.pad, когда паддинг не нужен
# read_ahead = true     # следующее окно растра читается в фоновом потоке
# batch_circles = true  # круги точек одним вызовом GEOS/PROJ
# fast_writer = true    # координаты GeoJSON одним вызовом GEOS
# fast_channels = true  # fix_channels без repeat + concatenate
# gdal_threads = true   # GDAL_NUM_THREADS=ALL_CPUS, если не задан
# slot_accum = true     # CUDA: накопление окон «слотами» (не входит в enabled — только явно)
# bot-5 (ветка bot5-gor-dense-v3): PFnoD бота 10 (bot-10/REPORT14_gor_dense.md, work14/pkg_gor2.json; PACKAGE-ONLY
# +0,015406, P 1,000) — точки городищ плотного локализатора DINOv2-S на SpOr (expds/gor_dense.py) после sp_dfine/drop_groups,
# группа порога gor_dense; conf = 0,5·(p участка головы gor_v3 + пик); гейт sp_or НЕ ставить (при R ему нечего гейтить).
# noD (классы drop_dfine_classes sp_dfine удаляются кодом на участках, где точки посчитаны) — флаг ВКЛ. делает это сам.
# v4: пакет принят как компонент (τ=0.824066, centre_s=250); default OFF — байт-в-байт как v3-без-SpOr-D-FINE.
# Включение (только для e2e/honest-10 приёмки пакета):
#   enabled = true
#   backbone = "models/dinov2-small"                 # тот же снапшот, что gor_gate (md5 ea251be6…)
#   gate_head = "models/gor_gate/gor_v3_head.npz"     # md5 acb95c52…
#   head = "models/gor_dense/gor_dense_head.npz"      # bot-5 export_head.py, вариант 'all', весь трейн; md5 e35570e1…
#   head_md5 = "e35570e10d17edac32bea8d26fa0f5f4"
#   centre_s = 250.0    # пакет v4: dense_probe на всём трейне (внутр. OOF, top-1 28/49)
#   + [thresholds_by_markup.gor_dense] gorodishcha = 0.824066   # пакет v4: медиана 10 τ PFnoD fam10 (pkg_gor2.json chosen2)
#   + [thresholds_by_markup.sp_dfine]
#     gorodishcha = 1.01      # noD конфигом (спека bot-7); дублирует noD в коде (drop_dfine_classes = ["gorodishcha"]).
#     Если [thresholds_by_markup.sp_dfine] уже пишет make_on.py — ключ gorodishcha = 1.01 дописать В ТУ таблицу,
#     второй заголовок [thresholds_by_markup.sp_dfine] = дубль таблицы TOML (ошибка разбора).
#   + v4 (решение бота 10): городища D-FINE Ae/Or бота 6 — порогом > 1 (TOML главнее thresholds_file):
#     [thresholds_by_markup.dfine_or] gorodishcha = 1.01 — уже стоит выше (bot-6), не дублировать;
#   + [thresholds_by_markup.dfine_ae]
#     gorodishcha = 1.01
[gor_dense]
enabled = false

