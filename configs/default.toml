coarse_relief_radius_l_m = 300.0
coarse_max_area_m2 = 200000.0
# Ужесточено после mock 337a27c ON Δ−0.01629 (вина: coarse +3 FP li/gorodishcha).
coarse_max_per_dem = 1
coarse_min_enclosure = 0.35
coarse_min_rel_height_m = 1.8
coarse_flat_max_deg = 12.0
coarse_scarp_min_deg = 18.0
[large_objects.core]
frac = 0.35
min_r_m = 2.0

# Копии крупных fortifikatsii → gorodishcha (sub-flag fort_to_gor). Keep-original-label;
# копия не добавляется при пересечении с существующим gor. OOF — pc/QUEUE.
[thresholds_by_markup.gor_from_fort]
