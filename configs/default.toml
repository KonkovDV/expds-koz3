# Конфигурация инференса КОЗ №3. Пути к моделям — относительно корня архива.

default_threshold = 0.15

[time]
budget_s = 1500      # 25 минут из 30: запас на запуск контейнера и запись
reserve_s = 120      # не начинать тяжёлый шаг, если осталось меньше

# Пороги выдачи по классам. Старт — F/(4−F) ≈ 0,1–0,2; подбор:
# python -m expds.metric sweep ... --out configs/thresholds.json и перенос сюда.
[thresholds]
kurgany_povrezhdennye = 0.15
kurgany_tselye = 0.15
gorodishcha = 0.15
arkhitektury = 0.15
fortifikatsii = 0.20
# Геофизика отсекается своим порогом по модальности ([geophys.*] min_confidence).
object_poly = 0.0
finds_points = 0.0

# Модели по markup_type (файлы из expds.train). Нет файла — модальность
# обрабатывается классикой (li, геофизика) или пропускается (оптика).
# Пороги модели li в режиме rescore: подобраны на предсказаниях вне обучения (5 фолдов по «семьям»,
# 15 участков, 1540 курганов); F1 0,557 и 0,535. Бутстреп по участкам: p10–p90 0,24–0,95 и 0,006–0,21.
[thresholds_by_markup.li]
kurgany_povrezhdennye = 0.394
kurgany_tselye = 0.0098

# Запасной путь без модели li: пики рельефа + LightGBM (3 класса); пороги — по его предсказаниям
# вне обучения (F1 0,455 и 0,344).
[thresholds_by_markup.li_cpu]
kurgany_povrezhdennye = 0.0121
kurgany_tselye = 0.0096

[li]
# rescore — курганы по пикам рельефа с уверенностью модели li (на отложенном Гнёздово 0,674
# против 0,538 у масок); segment — все классы масками модели.
mode = "rescore"

# DEM для запасного детектора курганов (без модели li). С моделью li параметры берутся
# из её чекпойнта — так, как она обучалась.
[lidar]
dem_res = 0.1
dem_fill = "delaunay"

[models]
li = "models/li_r18.pt"
# ae = "models/ae_r18.pt"
# sp_or = "models/spor_r18.pt"
# or = "models/or_r18.pt"

[candidates]
work_res = 0.5
relief_radius_m = 15.0
peak_radius_m = 4.0
min_relief_m = 0.12
r_in_m = 2.5
r_out_m = 8.0
circle_m = 2.0
lgbm_model = "models/kurgan_lgbm.txt"

[geophys]
point_circle_m = 0.3

# Подобрано scripts/geo_tune.py официальной метрикой на трейне (min_confidence — порог этой
# модальности). F1 с отложенной «семьёй»: finds_points 0,461, object_poly MagGr 0,341;
# у EtGr и TerFl одна «семья», проверка только на тех же данных (0,201 и 0,171).
[geophys.maggr.finds_points]
background_m = 2.0
peak_radius_m = 2.0
peak_k = 1.0
use_noise = true
confidence = "rank"
min_confidence = 0.1739

[geophys.maggr.object_poly]
background_m = 8.0
smooth_m = 0.5
poly_k = 1.5
use_noise = true
confidence = "rank"
min_confidence = 0.0714

[geophys.etgr.object_poly]
background_m = 2.0
smooth_m = 0.1
poly_k = 1.0
min_confidence = 0.0958

[geophys.terfl.object_poly]
background_m = 8.0
smooth_m = 0.25
poly_k = 1.0
min_confidence = 0.1426
